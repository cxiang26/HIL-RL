# 测试任务配置（用于A2D环境测试）
task_name: test_a2d_task

# 安全限制（示例值，需要根据实际机器人调整）
abs_pose_limit_high: [0.73,  -0.1, 0.75, -2.5, 0.3, -2]
abs_pose_limit_low: [0.53, -0.3, 0.6, -3, -0.3, -3.14]
#  0.66795, -0.217  ,  0.84573,  3.11036, -0.04319, -1.56098
# 重置关节位置（14个关节，A2D机器人）
# reset_joint: [-1.28, 0.79, 1.00, -0.50, 0.07, 1.38, 0.46, 2.24, -1.17, 2.36, -0.02, -2.43, 1.39, -0.89]
reset_joint: [0.6097, 0.5372, 0.8757, 0.8437, -0.4587, 0.1905, -0.2036,  0.63112, -0.24538,  0.66726,  0.71418, -0.67107,  0.16657, -0.10891]
# reset_pose: [0.6097, 0.5372, 0.8757, 0.8437, -0.4587, 0.1905, -0.2036, 0.74323, -0.26486,  0.74894,  0.75629, -0.65283, -0.00427,  0.04255]

# 数据集配置（测试时不需要）
"dataset": {
    "repo_id": "silri",
    "use_imagenet_stats": false,
    "root": "../../../offline_dataset/test_a2d_task"
}

# 奖励配置
gripper_penalty: -0.2

# 分类器配置（测试时不需要）
classifier_cfg:
    classifier_keys: ["right"]
    pretrained_encoder_path: ../resnet10_params.pkl
    checkpoint_path: classifier/checkpoints/000500
    dataset_path: offline_dataset/test_a2d_task
    reward_pos: 10.0
    reward_neg: -0.05
    require_train: false
    task_name: ${task_name}
    algorithm: hil-serl
    target_hz: 10
    batch_size: 128
    enable_stacking: false
    load_classifier: false

# 夹爪配置
close_gripper: false
fix_gripper: false

# 任务配置
max_episode_length: 100
max_train_time: 2400      # 最大训练时间（秒），2400秒 = 40分钟



