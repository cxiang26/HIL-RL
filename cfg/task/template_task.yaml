# 任务配置模板
# 复制此文件并重命名为你的任务，例如: my_task_my_robot.yaml
# 然后根据你的任务特性修改配置

task_name: your_task_name

# ========== 安全限制 ==========
# 定义机器人末端执行器的安全工作空间
# 格式: [x, y, z, rx, ry, rz] (位置 + 欧拉角)
# 单位: 位置(米), 角度(弧度)
abs_pose_limit_high: [0.7, 0.2, 0.5, 0, 0, 0]  # 上限
abs_pose_limit_low: [0.4, -0.2, 0.2, 0, 0, 0]  # 下限

# ========== 重置配置 ==========
# 重置时的关节位置（关节数量需与 robot_type 配置中的 joint_dim 匹配）
# Franka (7关节): [-0.24, -0.04, 0.20, -1.97, 0.02, 1.90, -0.23]
# UR (6关节): [0.0, -1.57, 1.57, -1.57, -1.57, 0.0]
reset_joint: [-0.1, -0.2, 0.1, -1.5, 0.0, 1.5, -0.2]

# ========== 数据集配置 ==========
"dataset": {
    "repo_id": silri,
    "use_imagenet_stats": false,
    "root": "../../../offline_dataset/your_task_your_robot"  # 修改为你的数据集路径
}

# ========== 奖励配置 ==========
gripper_penalty: -0.2  # 夹爪动作的惩罚值（负值表示惩罚）

# ========== 分类器配置 ==========
classifier_cfg:
    # 用于分类器的相机键
    classifier_keys: ["right"]
    
    # 预训练编码器路径
    pretrained_encoder_path: ../resnet10_params.pkl
    
    # 分类器检查点路径
    checkpoint_path: classifier/checkpoints/000500
    
    # 数据集路径
    dataset_path: offline_dataset/your_task_your_robot
    
    # 奖励值
    reward_pos: 10.0   # 成功时的奖励
    reward_neg: -0.05  # 失败时的奖励
    
    # 训练配置
    require_train: true      # 是否在RL训练期间继续训练分类器
    task_name: ${task_name}  # 任务名称
    algorithm: hil-serl      # 算法类型
    target_hz: 10           # 目标频率
    batch_size: 128          # 批次大小
    enable_stacking: false   # 是否启用帧堆叠
    load_classifier: ${load_classifier}  # 是否加载分类器

# ========== 夹爪配置 ==========
close_gripper: true   # 重置时是否关闭夹爪
fix_gripper: true     # 是否固定夹爪（不进行控制）

# ========== 任务参数 ==========
max_episode_length: 90    # 最大回合长度（步数）
                          # 通常设置为任务完成所需的最大步数
max_train_time: 2400      # 最大训练时间（秒）

